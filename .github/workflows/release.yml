name: Build & Publish Android Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "رقم الإصدار (مثال: v1.0.1) — اتركه فارغاً للتوليد التلقائي"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for unit tests
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ github.workspace }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No release keystore secrets found; generating a CI signing key (alias: upload)."
            FALLBACK_PASS="SakanReleaseCI2026!"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$FALLBACK_PASS" \
              -keypass "$FALLBACK_PASS" \
              -dname "CN=SakanManager, OU=Android, O=Sakan, L=Riyadh, S=Riyadh, C=SA"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$FALLBACK_PASS" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Rename release artifacts
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/SakanManager-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-output/SakanManager-release.aab

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SakanManager-release
          path: release-output/*

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "إدارة السكن ${{ steps.tag.outputs.tag }}"
          body: |
            إصدار Release لتطبيق **إدارة السكن** (APK جاهز للتثبيت المباشر + AAB لمتجر Play).
          files: |
            release-output/SakanManager-release.apk
            release-output/SakanManager-release.aab
          draft: false
          prerelease: false
